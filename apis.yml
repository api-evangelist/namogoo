aid: namogoo
name: Namogoo
description: 'Namogoo Technologies Ltd. is an Israeli (Herzliya) commerce-technology company
  founded in 2014, originally known for Customer Journey Hijacking prevention and later for
  its Digital Journey Continuity and Intent-Based Promotions products for online retailers.
  The company pivoted to real-time predictive AI for the customer experience, rebranded its
  product and site to Wandz.ai, and was acquired by French experimentation vendor AB Tasty in
  November 2025, where the technology now powers AB Tasty AdaptiveCX. Namogoo publishes no
  public REST API or OpenAPI definition; its integration surface is a JavaScript tag plus
  first-party mobile SDKs distributed through Maven Central (ai.wandz.android:core-wandz),
  CocoaPods (NamogooIBPSDK), Swift Package Manager (WandzSDK) and Packagist (Magento 2 modules),
  activated with an Account ID / client ID issued through the Wandz.ai platform portal.'
