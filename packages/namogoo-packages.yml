notes: >-
  Namogoo publishes no server-side REST client libraries because it publishes no public REST
  API. The first-party distribution surface is mobile SDKs and an e-commerce platform module.
  Packages under the Wandz.ai brand are the same first-party publisher — the npm account
  `wandz.ai` registers with an @namogoo.com address, and the Wandz SDKs are hosted in the
  github.com/namogoo organization.
